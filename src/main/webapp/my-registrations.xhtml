<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="jakarta.faces.passthrough">

<!-- The events the logged-in student has registered for. -->
<ui:composition template="/WEB-INF/templates/layout.xhtml">
    <ui:define name="title">My registrations &#183; NitteSync</ui:define>
    <ui:define name="content">

        <div class="page-head">
            <div>
                <p class="eyebrow">Student</p>
                <h1>My registrations</h1>
                <p class="lede">Every event you've signed up for, in one list.</p>
            </div>
            <div class="page-count">
                <strong>#{myRegistrationsBean.registrations.size()}</strong>
                <span>spots claimed</span>
            </div>
        </div>

        <h:panelGroup layout="block" styleClass="empty" rendered="#{empty myRegistrationsBean.registrations}">
            You haven't registered for anything yet.
            <h:link outcome="/events.xhtml" value="Browse the events" styleClass="link"/>
        </h:panelGroup>

        <h:dataTable value="#{myRegistrationsBean.registrations}" var="registration"
                     styleClass="table" headerClass="table-header" rowClasses="table-row"
                     p:tabindex="0"
                     rendered="#{not empty myRegistrationsBean.registrations}">

            <h:column>
                <f:facet name="header">Event</f:facet>
                <h:link outcome="/event-details.xhtml" styleClass="link">
                    <f:param name="eventId" value="#{registration.eventId}"/>
                    #{registration.eventTitle}
                </h:link>
            </h:column>

            <h:column>
                <f:facet name="header">Date</f:facet>
                <h:outputText value="#{registration.eventDate}">
                    <f:convertDateTime type="localDate" pattern="dd MMM yyyy"/>
                </h:outputText>
            </h:column>

            <h:column>
                <f:facet name="header">Venue</f:facet>
                #{registration.venue}
            </h:column>

            <h:column>
                <f:facet name="header">Registered on</f:facet>
                <h:outputText value="#{registration.registrationDate}">
                    <f:convertDateTime type="localDateTime" pattern="dd MMM yyyy, HH:mm"/>
                </h:outputText>
            </h:column>

        </h:dataTable>

    </ui:define>
</ui:composition>
</html>
