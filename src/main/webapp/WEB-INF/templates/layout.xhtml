<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      lang="en">

<!--
  The page template.

  Every page of the application is a client of this template: it defines the
  header, the navigation menu, the message area and the footer once, and each
  page only supplies its own content inside <ui:define name="content">.
-->
<h:head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>NitteSync</title>

    <!-- Citrus theme fonts. The font tokens in style.css carry system fallbacks,
         so the app still renders correctly on a machine with no network. -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@600;700&amp;family=Red+Hat+Text:wght@400;600&amp;display=swap"/>

    <link rel="icon" type="image/png" href="#{request.contextPath}/resources/img/favicon.png"/>
    <h:outputStylesheet name="css/style.css"/>
</h:head>

<h:body>
<div class="page">

    <header class="topbar">
        <h:link outcome="/dashboard.xhtml" styleClass="brand" value="NitteSync"/>
        <span class="tagline">Campus events at Nitte</span>
        <h:form styleClass="logout-form">
            <h:commandLink value="Logout" action="#{loginBean.logout}"
                           styleClass="logout-link" rendered="#{loginBean.loggedIn}"/>
        </h:form>
    </header>

    <!-- Navigation: every entry is a plain GET link, shown by role. -->
    <nav class="menu">
        <h:link outcome="/index.xhtml" value="Home" rendered="#{not loginBean.loggedIn}"/>
        <h:link outcome="/login.xhtml" value="Login" rendered="#{not loginBean.loggedIn}"/>
        <h:link outcome="/dashboard.xhtml" value="Dashboard" rendered="#{loginBean.loggedIn}"/>
        <h:link outcome="/events.xhtml" value="Events" rendered="#{loginBean.loggedIn}"/>
        <h:link outcome="/my-registrations.xhtml" value="My Registrations" rendered="#{loginBean.student}"/>
        <h:link outcome="/club-events.xhtml" value="My Events" rendered="#{loginBean.club}"/>
        <h:link outcome="/event-form.xhtml" value="Create Event" rendered="#{loginBean.club}"/>
        <h:link outcome="/admin-approval.xhtml" value="Approvals" rendered="#{loginBean.admin}"/>
        <h:link outcome="/admin-events.xhtml" value="All Events" rendered="#{loginBean.admin}"/>
    </nav>

    <main class="content">

        <!-- Message left behind by AuthFilter when a page was opened without permission. -->
        <h:panelGroup rendered="#{not empty loginBean.authMessage}">
            <div class="alert alert-error">#{loginBean.authMessage}</div>
        </h:panelGroup>

        <ui:insert name="content"/>

        <!--
          Success and error messages. This block deliberately comes AFTER the
          page content: a backing bean that fails while loading its data adds
          its message while the content is being rendered, and a message area
          placed above the content would already have been rendered by then.
        -->
        <h:messages globalOnly="true" layout="list" styleClass="messages"
                    infoClass="alert alert-info" errorClass="alert alert-error"
                    warnClass="alert alert-warn"/>
    </main>

    <footer class="footer">
        <p>NitteSync - Java and Spring Framework Lab mini-project.
           Built with Jakarta Faces 4.0, JDBC and MySQL.</p>
    </footer>
</div>
</h:body>
</html>
