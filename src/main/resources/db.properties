# ---------------------------------------------------------------------------
# NitteSync database configuration
#
# This is the only place where database settings live. Edit the values below
# so they match your local MySQL installation, then rebuild/redeploy.
#
# In a .properties file the '&' inside the URL is written literally (no &amp;).
# ---------------------------------------------------------------------------

# JDBC driver class (Connector/J 8.x).
db.driver=com.mysql.cj.jdbc.Driver

# Database URL.
#   sslMode=DISABLED              - no SSL on a local development server
#   allowPublicKeyRetrieval=true  - needed for MySQL 8+ caching_sha2_password
db.url=jdbc:mysql://localhost:3306/nitte_sync?sslMode=DISABLED&allowPublicKeyRetrieval=true

# MySQL user name.
db.user=root

# MySQL password.
# Leave the value empty when the root account has no password (the default on
# a fresh Homebrew install). If root does have a password, put it here, e.g.
#   db.password=mySecret123
db.password=