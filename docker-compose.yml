services:
  db:
    image: mysql:8.4
    container_name: nittesync-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: nitte_sync
    ports:
      - "3306:3306"
    volumes:
      - nittesync-mysql-data:/var/lib/mysql
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./src/main/resources/sample-data.sql:/docker-entrypoint-initdb.d/02-sample-data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nittesync-web
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: "jdbc:mysql://db:3306/nitte_sync?sslMode=DISABLED&allowPublicKeyRetrieval=true"
      DB_USER: "root"
      DB_PASSWORD: "password"

volumes:
  nittesync-mysql-data:
